<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes rotateWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pillFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bg-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .k8s-wheel { animation: rotateWheel 30s linear infinite; transform-origin: 1060px 180px; }
    .data-flow { stroke-dasharray: 8, 12; animation: dashMove 4s linear infinite; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    .pill-1 { animation: pillFloat 4s ease-in-out infinite; }
    .pill-2 { animation: pillFloat 4.5s ease-in-out infinite 0.5s; }
    .pill-3 { animation: pillFloat 5s ease-in-out infinite 1s; }
    .pill-4 { animation: pillFloat 4.2s ease-in-out infinite 1.5s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Ambient Glow Orbs in Deep Background -->
  <g opacity="0.4">
    <circle class="bg-orb-1" cx="180" cy="90" r="140" fill="#2563eb" filter="url(#glow)" />
    <circle class="bg-orb-2" cx="1020" cy="270" r="160" fill="#0284c7" filter="url(#glow)" />
    <circle cx="600" cy="180" r="100" fill="#4f46e5" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Geometric Grid & Circuit Lines (Background) -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Animated Dynamic Data Flows (Background) -->
  <path class="data-flow" d="M 50 180 Q 300 280 600 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <path class="data-flow" d="M 100 240 Q 400 100 700 220 T 1100 120" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.25" />

  <!-- Animated Floating Particles -->
  <circle class="particle-1" cx="240" cy="260" r="3" fill="#60a5fa" />
  <circle class="particle-2" cx="720" cy="80" r="4" fill="#38bdf8" />
  <circle class="particle-3" cx="890" cy="290" r="3" fill="#a5b4fc" />
  <circle class="particle-1" cx="510" cy="310" r="2.5" fill="#38bdf8" />

  <!-- Dynamic Rotating Kubernetes Helm Wheel in Background Right -->
  <g class="k8s-wheel" opacity="0.16">
    <circle cx="1060" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="5" />
    <circle cx="1060" cy="180" r="32" fill="none" stroke="#38bdf8" stroke-width="7" />
    <!-- 7 Spokes of K8s Helm -->
    <line x1="1060" y1="70" x2="1060" y2="148" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <line x1="1060" y1="212" x2="1060" y2="290" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <line x1="954" y1="128" x2="1030" y2="165" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <line x1="1090" y1="195" x2="1166" y2="232" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <line x1="954" y1="232" x2="1030" y2="195" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <line x1="1090" y1="165" x2="1166" y2="128" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Pill -->
  <g class="pill-1" transform="translate(80, 52)">
    <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="28" y="20" class="badge-text" fill="#38bdf8">CLOUD-NATIVE ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Subtitle (Crisp and High Contrast) -->
  <g transform="translate(80, 130)">
    <!-- Title -->
    <text class="title-text" fill="#ffffff" filter="url(#subtleGlow)">
      Awesome <tspan fill="url(#primaryGrad)">Local Kubernetes</tspan> Environments
    </text>
    
    <!-- Subtitle -->
    <text y="42" class="subtitle-text">
      The ultimate curated guide to lightweight clusters, sandboxes, and inner-loop developer workflows
    </text>
    <text y="70" class="subtitle-text" font-size="14px" fill="#64748b">
      Single-Node Sandboxes • Ephemeral CI Clusters • Multi-Node Testbeds • Container Runtimes
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Interactive Floating Tech Badges (Pills) -->
  <g transform="translate(80, 260)">
    <!-- Pill 1: K3s -->
    <g class="pill-1" transform="translate(0, 0)">
      <rect width="110" height="38" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="24" class="badge-text" fill="#f8fafc">⚡ K3s</text>
    </g>

    <!-- Pill 2: Kind -->
    <g class="pill-2" transform="translate(126, 0)">
      <rect width="118" height="38" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="24" class="badge-text" fill="#f8fafc">📦 kind</text>
    </g>

    <!-- Pill 3: Minikube -->
    <g class="pill-3" transform="translate(260, 0)">
      <rect width="138" height="38" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="24" class="badge-text" fill="#f8fafc">☸️ minikube</text>
    </g>

    <!-- Pill 4: MicroK8s -->
    <g class="pill-4" transform="translate(414, 0)">
      <rect width="138" height="38" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="24" class="badge-text" fill="#f8fafc">🚀 MicroK8s</text>
    </g>

    <!-- Pill 5: vcluster -->
    <g class="pill-1" transform="translate(568, 0)">
      <rect width="130" height="38" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="24" class="badge-text" fill="#f8fafc">🪆 vcluster</text>
    </g>

    <!-- Pill 6: Talos -->
    <g class="pill-2" transform="translate(714, 0)">
      <rect width="118" height="38" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="24" class="badge-text" fill="#f8fafc">🛡️ Talos</text>
    </g>
  </g>
</svg>
